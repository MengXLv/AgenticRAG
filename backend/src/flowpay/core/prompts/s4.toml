conditions_discarded = "这些编号属于此前的账户或环境，已经作废，不要再拿它们去查：{gone}。"

known_condition_item = "{name}={value}"

conditions_still_missing = "仍然缺少 {missing}，可以只问这些。"

conditions_complete = "不要重复索要。"

conditions_already_known = "这些条件用户已经提供：{given}。请直接使用；{rest}"

question_pending = "本轮已有一个待回复的追问，这次不再发出。"

question_sent = "已向用户提出，等待回复。"
