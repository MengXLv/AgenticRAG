[project]
name = "flowpay-teaching"
version = "0.1.0"
description = "Traceable runtime for the FlowPay RAG course"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "openai>=2,<3",
  "pyyaml>=6,<7",
  "pydantic>=2,<3",
  "typing-extensions>=4.12,<5",
  "rank-bm25>=0.2.2,<0.3",
  "jieba>=0.42.1,<0.43",
]

[project.scripts]
flowpay = "flowpay.cli:main"

[project.optional-dependencies]
reranking = [
  "torch>=2.6,<2.7",
  "transformers>=4.48,<5",
  "sentencepiece>=0.2,<0.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpay"]

[dependency-groups]
dev = [
    "basedpyright>=1.38,<2",
    "httpx2>=2.12,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
